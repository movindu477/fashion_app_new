name: flutterfashion_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  video_player: ^2.8.2
  image_picker: ^1.0.4
  firebase_storage: ^12.1.0
  camera: ^0.11.0
  image: ^4.1.3
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  page_transition: ^2.1.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  in_app_purchase: ^3.2.0
  tflite_flutter: ^0.12.1
  image_cropper: ^8.0.2
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  icons_launcher: ^3.0.3

icons_launcher:
  image_path: "assets/images/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/images/logo.png"
      adaptive_background_color: "#000000"
      adaptive_foreground_image: "assets/images/logo.png"
      adaptive_icon_background: "#000000"
    ios:
      enable: true
      image_path: "assets/images/logo.png"


flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/main3.jpg
    - assets/images/main3ori.jpg
    - assets/images/profile.webp
    - assets/images/main3ori.webp
    - assets/images/main4.jpg
    - assets/images/main5.jpg
    - assets/images/main6.jpg
    - assets/images/main6ori.jpg
    - assets/images/main7.jpg
    - assets/images/main8.jpg
    - assets/images/login.jpg
    - assets/images/login.webp
    - assets/images/register.jpg
    - assets/images/login2.png
    - assets/images/register2.png
    - assets/images/hello.jpg
    - assets/images/hello2.jpg
    - assets/images/hello3.jpg
    - assets/images/hello4.jpg
    - assets/models/clean_fabric_classifier.tflite

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
