name: flutterfashion_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  video_player: ^2.8.2
  image_picker: ^1.0.7
  http: ^1.2.0
  firebase_storage: ^12.1.0
  quickalert: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  icons_launcher: ^3.0.3

icons_launcher:
  image_path: "assets/images/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/login.mp4
    - assets/images/reg.mp4
    - assets/images/home1.mp4
    - assets/images/logo.png
    - assets/images/splash.mp4