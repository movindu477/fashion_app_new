name: flutterfashion_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  video_player: ^2.8.2
  image_picker: ^1.0.4
  firebase_storage: ^12.1.0
  quickalert: ^1.1.0
  camera: ^0.11.0
  image: ^4.1.3
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  page_transition: ^2.1.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  in_app_purchase: ^3.2.0
  tflite_flutter: ^0.11.0
  image_cropper: ^8.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  icons_launcher: ^3.0.3

icons_launcher:
  image_path: "assets/images/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/images/logo.png"
      adaptive_background_color: "#000000"
      adaptive_foreground_image: "assets/images/logo.png"
      adaptive_icon_background: "#000000"
    ios:
      enable: true
      image_path: "assets/images/logo.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/home1.mp4
    - assets/images/logo.png
    - assets/images/main3.jpg
    - assets/images/main3ori.jpg
    - assets/images/main4.jpg
    - assets/images/main5.jpg
    - assets/images/main6.jpg
    - assets/images/main7.jpg
    - assets/images/main8.jpg
    - assets/models/fabric_classifier_model.tflite
